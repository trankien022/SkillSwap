name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (locked)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Architecture tests
        run: pnpm test:arch

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real Postgres + RabbitMQ (docker services); Jitsi is left out of CI, so the
    # Jitsi spec self-skips. Runs the booking flow end to end against the DB.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: skillswap
          POSTGRES_PASSWORD: skillswap_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skillswap"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Hosted Jitsi (ADR-039). CI has no JaaS account, so the token issuer only needs
      # *a* key to construct; the Jitsi spec self-skips because there is no reachable
      # deployment and the presence suites sign their own webhook bodies.
      JITSI_APP_ID: vpaas-magic-cookie-ci
      JITSI_KEY_ID: ci
      JITSI_DOMAIN: 8x8.vc/vpaas-magic-cookie-ci
      # `pnpm keys:gen` writes a placeholder PEM here, enough for the issuer to sign. Real
      # tokens are only accepted when signed by a key from the JaaS console, so CI never
      # pretends to have one -- it just avoids booting without a key at all.
      JITSI_PRIVATE_KEY_PATH: ../../.secrets/jaas-private.pem
      # The presence webhook refuses every request when its secret is empty (ADR-039 --
      # a misconfiguration must not let a stranger close classes). The workflow copies
      # `.env.example`, where the secret is deliberately blank, so without this the
      # room-idle suites get 401s and fail. Exported here so the API process AND the E2E
      # specs (which read process.env to sign their requests) agree on one value.
      JITSI_WEBHOOK_SECRET: skillswap_jitsi_webhook_dev_secret
      # Cross-module projections are event-fed; drain the outbox promptly so a
      # loaded runner does not sit on the default 2s relay tick between a write
      # and the read that asserts it.
      OUTBOX_POLL_INTERVAL_MS: 250
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (locked)
        run: pnpm install --frozen-lockfile

      - name: Prepare local env + keys
        run: |
          cp .env.example .env
          pnpm keys:gen

      - name: Seed roles and schemas (ADR-007)
        env:
          PGPASSWORD: skillswap_dev
        run: |
          psql -h localhost -U postgres -d skillswap -f docker/postgres/init/01-roles.sql
          psql -h localhost -U postgres -d skillswap -f docker/postgres/init/02-schemas.sql

      - name: Build contracts
        run: pnpm --filter @skillswap/contracts build

      - name: Build api (for the migration runner)
        run: pnpm --filter @skillswap/api build

      - name: Apply migrations
        run: node scripts/migrate.mjs

      - name: End-to-end tests (real Postgres + RabbitMQ)
        run: pnpm test:e2e

