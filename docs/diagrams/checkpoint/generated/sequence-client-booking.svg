ke-width:1;stroke-dasharray:2,2;"/><text x="26.127" y="511.611" fill="#000" font-size="14" textLength="97.986" font-weight="700" font-family="Arial">[Booking held]</text><polygon points="636.153,535.677,626.153,539.677,636.153,543.677,632.153,539.677" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="630.153" y1="539.677" x2="971.896" y2="539.677" style="stroke:#475569;stroke-width:1;stroke-dasharray:2,2;"/><text x="642.153" y="534.71" fill="#000" font-size="14" textLength="212.078" font-family="Arial">Booking id + price, status Pending</text><polygon points="318.789,565.775,308.789,569.775,318.789,573.775,314.789,569.775" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="312.789" y1="569.775" x2="624.153" y2="569.775" style="stroke:#475569;stroke-width:1;stroke-dasharray:2,2;"/><text x="324.789" y="564.809" fill="#000" font-size="14" textLength="111.679" font-family="Arial">Booking id + price</text><polygon points="613.153,595.874,623.153,599.874,613.153,603.874,617.153,599.874" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="307.789" y1="599.874" x2="619.153" y2="599.874" style="stroke:#475569;stroke-width:1;"/><text x="314.789" y="594.907" fill="#000" font-size="14" textLength="293.364" font-family="Arial">POST /api/classes/bookings/:bookingId/confirm</text><polygon points="960.896,625.973,970.896,629.973,960.896,633.973,964.896,629.973" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="625.153" y1="629.973" x2="966.896" y2="629.973" style="stroke:#475569;stroke-width:1;"/><text x="632.153" y="625.006" fill="#000" font-size="14" textLength="300.378" font-family="Arial">Commit the booking and emit booking.confirmed</text><polygon points="1335.067,656.071,1345.067,660.071,1335.067,664.071,1339.067,660.071" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="972.896" y1="660.071" x2="1341.067" y2="660.071" style="stroke:#475569;stroke-width:1;"/><text x="979.896" y="655.104" fill="#000" font-size="14" textLength="350.171" font-family="Arial">Settle the escrow (asynchronous, idempotent consumer)</text><polygon points="48.127,686.17,38.127,690.17,48.127,694.17,44.127,690.17" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="42.127" y1="690.17" x2="306.789" y2="690.17" style="stroke:#475569;stroke-width:1;stroke-dasharray:2,2;"/><text x="54.127" y="685.203" fill="#000" font-size="14" textLength="246.661" font-family="Arial">Confirmation; the seat is really reserved</text><path d="M236.92,717.17 L236.92,791.17 L1417.92,791.17 L1417.92,727.17 L1407.92,717.17 L236.92,717.17" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1407.92,717.17 L1407.92,727.17 L1417.92,727.17 L1407.92,717.17" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="598.029" y="735.302" fill="#000" font-size="14" textLength="344.764" font-family="Arial">Both clients post to the real hold and confirm endpoints.</text><text x="598.029" y="751.4" fill="#000" font-size="14" textLength="404.612" font-family="Arial">Confirmation is committed before wallet settlement, so settlement</text><text x="598.029" y="767.499" fill="#000" font-size="14" textLength="406.246" font-family="Arial">is asynchronous and the client must not assume it has happened.</text><text x="598.029" y="783.598" fill="#000" font-size="14" textLength="449.798" font-family="Arial">Mock gateways remain only as an unconfigured-build fallback on mobile.</text><?plantuml-src ZLLHJzim47xFhpYn5z1Q2X8CKIGaYDQkKZSG3F72YnjV6gkEBxETLftsutTsqZM5igqlINpdk-----xgbTS8jqGB44P29TQGMoh15mWhd05PA6ccs2VJ2es7Np1ww9-SNFIQvoKVfBMrmQJAIcF9Ry8hCebRA5C9AqgOYMmnjrGRcPBcY1z6yTVnS8MGj59c3hdG3ZiMYRcejH-HyTz4YN1ZbT3xxO_g9yBfMSTuOosjsfnd5-VddouxHf5vjLH-VVi6tU