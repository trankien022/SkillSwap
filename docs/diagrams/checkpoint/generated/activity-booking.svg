<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1394px;height:1074px;background:#FFFFFF;" width="1394px" height="1074px" viewBox="0 0 1394 1074" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="485.895" y="33.132" fill="#000" font-size="14" textLength="421.046" font-weight="700" font-family="Arial">Book and pay for a class | FR-007/009 | BR-021-026/034-038/068</text></g><ellipse cx="820.301" cy="62.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="721.198" y="92.099" width="198.206" height="36.099" fill="#F1F5F9" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="731.198" y="115.23" fill="#000" font-size="14" textLength="178.206" font-family="Arial">Learner asks to book a class</text><rect x="648.812" y="198.247" width="342.978" height="36.099" fill="#F1F5F9" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="658.812" y="221.378" fill="#000" font-size="14" textLength="322.978" font-family="Arial">Return the existing booking without creating another</text><ellipse cx="820.301" cy="272.796" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="820.301" cy="272.796" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="706.68,148.197,933.921,148.197,945.921,160.197,933.921,172.197,706.68,172.197,694.68,160.197,706.68,148.197" fill="#F1F5F9" style="stroke:#475569;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="824.301" y="185.329" fill="#000" font-size="14" textLength="24.124" font-family="Arial">Yes</text><text x="706.68" y="165.28" fill="#000" font-size="14" textLength="227.24" font-family="Arial">Is this a repeat of the same request?</text><polygon points="656.098,325.796,984.503,325.796,996.503,349.944,984.503,374.092,656.098,374.092,644.098,349.944,656.098,325.796" fill="#F1F5F9" style="stroke:#475569;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="656.098" y="338.928" fill="#000" font-size="14" textLength="259.923" font-family="Arial">Class open, seat available, not own class,</text><text x="656.098" y="355.026" fill="#000" font-size="14" textLength="328.405" font-family="Arial">no existing active booking, starts in at least 24 hours,</text><text x="656.098" y="371.125" fill="#000" font-size="14" textLength="164.213" font-family="Arial">and lasts 30-180 minutes?</text><text x="619.974" y="346.977" fill="#000" font-size="14" textLength="24.124" font-family="Arial">Yes</text><text x="996.503" y="346.977" fill="#000" font-size="14" textLength="17.896" font-family="Arial">No</text><rect x="508.512" y="384.092" width="251.171" height="52.197" fill="#F1F5F9" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="518.512" y="407.224" fill="#000" font-size="14" textLength="163.42" font-family="Arial">Hold a seat for 15 minutes</text><text x="518.512" y="423.322" fill="#000" font-size="14" textLength="231.171" font-family="Arial">and keep the price agreed at booking</text><rect x="882.094" y="384.092" width="248.819" height="52.197" fill="#F1F5F9" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="892.094" y="407.224" fill="#000" font-size="14" textLength="228.819" font-family="Arial">Refuse the booking and explain why;</text><text x="892.094" y="423.322" fill="#000" font-size="14" textLength="126.861" font-family="Arial">do not take payment</text><ellipse cx="1006.503" cy="467.289" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="1006.503" cy="467.289" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="688.511" y="498.289" width="263.578" height="36.099" fill="#F1F5F9" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="698.511" y="521.421" fill="#000" font-size="14" textLength="243.578" font-family="Arial">Show booking as Awaiting confirmation</text><path d="M332.041,544.388 L332.041,586.585 L641.77,586.585 L641.77,554.388 L631.77,544.388 L332.041,544.388" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M631.77,544.388 L631.77,554.388 L641.77,554.388 L631.77,544.388" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="338.041" y="562.52" fill="#000" font-size="14" textLength="272.351" font-family="Arial">Current confirmation checks booking status.</text><text x="338.041" y="578.618" fill="#000" font-size="14" textLength="288.729" font-family="Arial">It does not check the 15-minute deadline itself.</text><polygon points="653.77,586.585,986.831,586.585,998.831,598.585,986.831,610.585,653.77,610.585,641.77,598.585,653.77,586.585" fill="#F1F5F9" style="stroke:#475569;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="653.77" y="603.667" fill="#000" font-size="14" textLength="333.061" font-family="Arial">Learner confirms before the system cancels the hold?</text><text x="617.646" y="595.618" fill="#000" font-size="14" textLength="24.124" font-family="Arial">Yes</text><text x="998.831" y="595.618" fill="#000" font-size="14" textLength="17.896" font-family="Arial">No</text><rect x="277.838" y="620.585" width="215.337" height="36.099" fill="#F1F5F9" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="287.838" y="643.717" fill="#000" font-size="14" textLength="195.337" font-family="Arial">Save the booking as Confirmed</text><rect x="257.218" y="691.684" width="256.578" height="36.099" fill="#F1F5F9" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="267.218" y="714.815" fill="#000" font-size="14" textLength="236.578" font-family="Arial">Return the confirmation to the Learner</text><rect x="232.314" y="747.782" width="306.385" height="36.099" fill="#F1F5F9" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="242.314" y="770.914" fill="#000" font-size="14" textLength="286.385" font-family="Arial">Process the wallet payment in the background</text><polygon points="276.945,803.881,494.068,803.881,506.068,815.881,494.068,827.881,276.945,827.881,264.945,815.881,276.945,803.881" fill="#F1F5F9" style="stroke:#475569;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="276.945" y="820.963" fill="#000" font-size="14" textLength="217.123" font-family="Arial">Does the wallet payment succeed?</text><text x="240.821" y="812.914" fill="#000" font-size="14" textLength="24.124" font-family="Arial">Yes</text><text x="506.068" y="812.914" fill="#000" font-size="14" textLength="17.896" font-family="Arial">No</text><rect x="16" y="837.881" width="388.108" height="52.197" fill="#F1F5F9" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="861.013" fill="#000" font-size="14" textLength="235.006" font-family="Arial">Deduct the full price from the Learner;</text><text x="26" y="877.111" fill="#000" font-size="14" textLength="368.108" font-family="Arial">allocate Teacher income and the 10% platform fee together</text><rect x="34.29" y="916.177" width="351.529" height="36.099" fill="#F1F5F9" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="44.29" y="939.309" fill="#000" font-size="14" textLength="331.529" font-family="Arial">Keep Teacher income on hold until release is allowed</text><path d="M717.811,837.881 L717.811,863.029 L697.811,867.029 L717.811,871.029 L717.811,896.177 A0,0 0 0 0 717.811,896.177 L1105.354,896.177 A0,0 0 0 0 1105.354,896.177 L1105.354,847.881 L1095.354,837.881 L717.811,837.881 A0,0 0 0 0 717.811,837.881" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1095.354,837.881 L1095.354,847.881 L1105.354,847.881 L1095.354,837.881" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="723.811" y="856.013" fill="#000" font-size="14" textLength="205.461" font-family="Arial">Current gap against BR-022/026:</text><text x="723.811" y="872.111" fill="#000" font-size="14" textLength="299.599" font-family="Arial">confirmation is saved before payment succeeds.</text><text x="723.811" y="888.21" fill="#000" font-size="14" textLength="366.543" font-family="Arial">A failed payment does not automatically undo confirmation.</text><rect x="424.108" y="840.93" width="273.702" height="52.197" fill="#F1F5F9" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="434.108" y="864.062" fill="#000" font-size="14" textLength="166.517" font-family="Arial">Retry payment processing;</text><text x="434.108" y="880.161" fill="#000" font-size="14" textLength="253.702" font-family="Arial">keep unresolved failures for investigation</text><polygon points="385.507,958.275,397.507,970.275,385.507,982.275,373.507,970.275,385.507,958.275" fill="#F1F5F9" style="stroke:#475569;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="1135.354" y="620.585" width="239.481" height="52.197" fill="#F1F5F9" style="stroke:#475569;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1145.354" y="643.717" fill="#000" font-size="14" textLength="201.551" font-family="Arial">System cancels the expired hold</text><text x="1145.354" y="659.815" fill="#000" font-size="14" textLength="219.481" font-family="Arial">and makes the seat available again</text><polygon points="820.301,988.275,832.301,1000.275,820.301,1012.275,808.301,1000.275,820.301,988.275" fill="#F1F5F9" style="stroke:#475569;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="820.301" cy="1043.275" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="820.301" cy="1043.275" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="820.301" y1="72.099" x2="820.301" y2="92.099" style="stroke:#475569;stroke-width:1;"/><polygon points="816.301,82.099,820.301,92.099,824.301,82.099,820.301,86.099" fill="#475569" style="stroke:#475569;s