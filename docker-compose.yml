# SkillSwap local infrastructure (ADR-007 schema-per-module, ADR-013 RabbitMQ).
# Usage: `docker compose up -d` — init scripts seed roles/schemas on first boot.
services:
  postgres:
    image: postgres:17
    container_name: skillswap-postgres
    environment:
      POSTGRES_DB: skillswap
      POSTGRES_PASSWORD: skillswap_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d skillswap']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: skillswap-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  rabbitmq-data:
